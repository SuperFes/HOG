name: CI

# Runs on release tags (v*) and by hand (gh workflow run ci.yml), not every push: each change passes
# the same builds, tests, tidy and format locally first, and these platforms are checked per release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang with libc++ is the primary toolchain (it matches macOS); GCC stays as a portability check.
          - { name: Linux Clang libc++, os: ubuntu-24.04, cxx: clang++-22, llvm: 22, libcxx: 'ON', preset: ci }
          - { name: Linux sanitizers, os: ubuntu-24.04, cxx: clang++-22, llvm: 22, libcxx: 'ON', preset: ci-asan }
          - { name: Linux thread sanitizer, os: ubuntu-24.04, cxx: clang++-22, llvm: 22, libcxx: 'ON', preset: ci-tsan }
          - { name: Linux GCC, os: ubuntu-24.04, cxx: g++-14, libcxx: 'OFF', preset: ci }
          - { name: Windows MSVC, os: windows-2025, cxx: cl, libcxx: 'OFF', preset: ci }
          - { name: macOS AppleClang, os: macos-15, cxx: clang++, libcxx: 'OFF', preset: ci }
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      # The runner's stock Clang 18 can't use libstdc++ 14's <expected>.
      - name: Install LLVM ${{ matrix.llvm }}
        if: matrix.llvm
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y libclang-rt-${{ matrix.llvm }}-dev libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev
      # Window system headers for SDL3, which the debug viewer is built on.
      - name: Install X11 and Wayland headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev
          libegl1-mesa-dev
      # The connection's encryption; Windows uses its own BCrypt.
      - name: Install OpenSSL
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev
      - name: Find OpenSSL
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      # Lavapipe and the validation layer, so GPU tests run the same on runners without a GPU.
      - name: Install a software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
      # Older sanitizer runtimes crash under the runner kernel's high mmap randomization.
      - name: Lower mmap randomization
        if: startsWith(matrix.preset, 'ci-') && runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DHOG_USE_LIBCXX=${{ matrix.libcxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx run clang-format==23.1.3 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y clang-tidy-22
      # Window system headers for SDL3, which the debug viewer is built on.
      - name: Install X11 and Wayland headers
        run: >-
          sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev
          libegl1-mesa-dev
      - name: Install OpenSSL
        run: sudo apt-get install -y libssl-dev
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=clang++-22
      # Generated headers must exist before analysis.
      - name: Build
        run: cmake --build --preset debug
      - name: Analyze
        run: |
          git ls-files '*.cpp' \
            | xargs clang-tidy-22 -p build/debug --quiet --warnings-as-errors='*'
