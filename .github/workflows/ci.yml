name: CI

# Docs-only changes don't need the build matrix; private-repo minutes are limited.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, preset: ci }
          - { name: Linux Clang, os: ubuntu-24.04, cc: clang-22, cxx: clang++-22, llvm: 22, preset: ci }
          - { name: Linux sanitizers, os: ubuntu-24.04, cc: clang-22, cxx: clang++-22, llvm: 22, preset: ci-asan }
          - { name: Linux thread sanitizer, os: ubuntu-24.04, cc: clang-22, cxx: clang++-22, llvm: 22, preset: ci-tsan }
          - { name: Windows MSVC, os: windows-2025, cc: cl, cxx: cl, preset: ci }
          - { name: macOS AppleClang, os: macos-15, cc: clang, cxx: clang++, preset: ci }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      # The runner's stock Clang 18 can't use libstdc++ 14's <expected>.
      - name: Install LLVM ${{ matrix.llvm }}
        if: matrix.llvm
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y libclang-rt-${{ matrix.llvm }}-dev
      # Older sanitizer runtimes crash under the runner kernel's high mmap randomization.
      - name: Lower mmap randomization
        if: startsWith(matrix.preset, 'ci-') && runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx run clang-format==23.1.3 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - name: Install LLVM 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y clang-tidy-22
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: cmake --preset debug
      # Generated headers must exist before analysis.
      - name: Build
        run: cmake --build --preset debug
      - name: Analyze
        run: |
          git ls-files '*.cpp' \
            | xargs clang-tidy-22 -p build/debug --quiet --warnings-as-errors='*'
