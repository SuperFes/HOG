name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, preset: ci }
          - { name: Linux Clang, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: ci }
          - { name: Linux sanitizers, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: ci-asan }
          - { name: Linux thread sanitizer, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: ci-tsan }
          - { name: Windows MSVC, os: windows-2025, cc: cl, cxx: cl, preset: ci }
          - { name: macOS AppleClang, os: macos-15, cc: clang, cxx: clang++, preset: ci }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      # Older sanitizer runtimes crash under the runner kernel's high mmap randomization.
      - name: Lower mmap randomization
        if: startsWith(matrix.preset, 'ci-') && runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx run clang-format==23.1.3 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: cmake --preset debug
      # Generated headers must exist before analysis.
      - name: Build
        run: cmake --build --preset debug
      - name: Analyze
        run: |
          git ls-files '*.cpp' \
            | xargs pipx run clang-tidy==22.1.8 -p build/debug --quiet --warnings-as-errors='*'
