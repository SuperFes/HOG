# Plants for the development server: how much each biome holds, how fast it grows back, how it
# burns, and how it dies back in a drought.
[growth]
seeds = 0.02
cold = 0
warm = 15
wet = 0.5

# kg per m² of living plants, fully grown.
[growth.capacity]
beach = 0.1
tundra = 0.3
boreal_forest = 10
temperate_forest = 20
grassland = 0.5
shrubland = 2
desert = 0.1
savanna = 3
tropical_rainforest = 30
alpine = 0.3
wetland = 5

# Years to grow back most of the way after burning, in good weather.
[growth.years]
beach = 2
tundra = 10
boreal_forest = 80
temperate_forest = 60
grassland = 1
shrubland = 8
desert = 5
savanna = 5
tropical_rainforest = 40
alpine = 10
wetland = 20

[fire]
# About 4% of the land burns a year, mostly from a score or so of lightning strikes.
damp = 0.5
parched = 0.9
fuel = 0.5
lightning = 0.05
spread = 1.5
wind = 0.15
burn_days = 2
douse = 5
out = 0.05
# Years for the blackened ground to green again, about.
scar = 1.5

[dying]
# Plants feel the ground water's shortfall below its usual level over a season. A new forest's
# first two years teach them the dry season they're used to; a tenth worse, they die back over a
# couple of years, and grow used to worse over a decade or so. The dead stand a decade or so, and
# regrowth takes most of a century to count as old growth.
days = 120
tolerance = 0.1
learning = 2
adapting = 10
worst = 0.6
years = 2
standing = 12
maturing = 80
