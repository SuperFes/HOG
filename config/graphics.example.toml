# What this machine draws, for what its GPU can afford: copied to config/graphics.toml, which
# git leaves alone, to change. Every key may be left out, keeping the default shown. Distances are
# metres from the eye.

# Every biome's grass, at full density out to hold, thinning with distance squared beyond, those
# blades left drawn wider to cover the ground as thickly. Each blade shrinks away as it comes under
# a couple of pixels tall, so short grass stays near and tall grass reaches further, all by far.
[grass]
# density = 40.0         # blades a square metre up close
# hold = 25.0
# far = 260.0
# The ground grown on, by the metres between its vertices: no more than finest within fine, where
# single blades show, and no more than coarsest beyond, 15.9 at most.
# finest = 0.75
# fine = 55.0
# coarsest = 6.0

[bushes]
# far = 260.0

# The grown trees near the eye, shedding detail with distance: the fullest out to full, the
# middle to mid, the coarsest to far, where the stamps take over.
[forest]
# full = 80.0
# mid = 150.0
# far = 240.0

# The stamps, out to far; the ground wears the canopy's colour beyond.
[trees]
# far = 900.0
