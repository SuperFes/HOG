# What this machine draws, for what its GPU can afford: copied to config/graphics.toml, which
# git leaves alone, to change. Every key may be left out, keeping the default shown. Distances are
# metres from the eye.

[grass]
# The lawn: every biome's blades, at full density out to lawn_near, thinning with distance squared
# beyond, those left drawn wider to cover the ground as thickly; all shrunk away by lawn_far.
# lawn_near = 25.0
# lawn_far = 55.0
# density = 40.0         # blades a square metre up close
# finest = 0.75          # metres between the ground's vertices at most for the lawn

# The far swaths: the tall biomes' blades only, thinning as the lawn does, out to tall_far.
# tall_density = 4.0     # blades a square metre, held out to tall_hold
# tall_hold = 60.0
# tall_far = 260.0
# tall_coarsest = 6.0    # metres between the ground's vertices at most for the swaths, 15.9 at most

[bushes]
# far = 260.0

# The grown trees near the eye, shedding detail with distance: the fullest out to full, the
# middle to mid, the coarsest to far, where the stamps take over.
[forest]
# full = 80.0
# mid = 150.0
# far = 240.0

# The stamps, out to far; the ground wears the canopy's colour beyond.
[trees]
# far = 900.0
