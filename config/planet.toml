# The working world: Earth's air, water and plates on a 30 km radius. Heights follow the radius,
# so the relief is proportionate to it; only the shell is set here.
[planet]
seed = 1 # 812080951
ocean_fraction = 0.7
radius_km = 115
# Locked to real time: four hours of day and night, through Earth's year and seasons.
day_hours = 4
axial_tilt = 23.44

[globe]
preset = "earth"
radius = 115000.0
floor_depth = 2500.0
sky_height = 12000.0
wear = 0.08
voxel = 0.333333333
# The land formed stage by stage, plates to soil, on a sphere split this many times; 0 leaves it
# to the generator's own terms (and `wear`).
formed_detail = 7.0
