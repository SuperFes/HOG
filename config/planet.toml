# The working world: Earth's air, water and plates on a 30 km radius. Heights follow the radius,
# so the relief is proportionate to it; only the shell is set here.
[planet]
seed = 1 # 812080951
ocean_fraction = 0.7
radius_km = 30
# Locked to real time: four hours of day and night, through Earth's year and seasons.
day_hours = 4
axial_tilt = 23.44

[globe]
preset = "earth"
radius = 30000.0
floor_depth = 500.0
sky_height = 3000.0
wear = 0.03
voxel = 0.5
