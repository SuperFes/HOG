# Development planet: the 500k population tier from docs/plan.md, about 115 km in radius.
[planet]
seed = 2
ocean_fraction = 0.7
population = 500_000
# Locked to real time: four hours of day and night, through Earth's year and seasons.
day_hours = 4
axial_tilt = 23.44
# River width and depth against Earth's for the water they carry; this planet's small basins make
# creeks at 1.
river_scale = 1
