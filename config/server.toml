# Development server. Paths are relative to this file.
[server]
world = "../var/world.db"
planet = "planet.toml"
tick_rate = 20

[save]
interval_minutes = 5
keep = 3
catch_up_ticks = 2000

[log]
level = "info"
file = "../var/logs/server.jsonl"

[metrics]
interval_seconds = 10

[weather]
cell_km = 6
step_minutes = 10
day_hours = 24

[wildlife]
ecology = "ecology.toml"
step_hours = 24

[forest]
vegetation = "forest.toml"
step_hours = 1
# A new world's first island burned this long before it begins: snags among young regrowth.
burned_years_ago = 8

[net]
port = 7675 # PORK on a phone keypad
# Made by hog-login on its first run, from the repository's root.
login_key = "../var/login.pub"
# A bad network to try the game on, in ms and percent, added both ways.
# simulate = "lag=75,jitter=10,loss=2,reorder=1"
view_m = 500
snapshot_bytes = 1200

[debug]
port = 7777
# Lets the viewer pause, step and speed up the clock; the world then stays wherever it's left
# rather than catching up to real time on start.
time_control = true
# start = 2026-01-01T00:00:00Z   # a new world's first moment, instead of now
