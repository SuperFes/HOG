# Development server. Paths are relative to this file.
[server]
world = "../var/world.db"
planet = "planet.toml"
tick_rate = 20

[save]
interval_minutes = 5
keep = 3
catch_up_ticks = 2000

[log]
level = "info"
file = "../var/logs/server.jsonl"

[metrics]
interval_seconds = 10

[weather]
cell_km = 6
step_minutes = 10
day_hours = 24

[wildlife]
ecology = "ecology.toml"
step_hours = 24

[forest]
vegetation = "forest.toml"
step_hours = 1

[net]
port = 27015

[debug]
port = 7777
# Lets the viewer pause, step and speed up the clock; the world then stays wherever it's left
# rather than catching up to real time on start.
time_control = true
# start = 2026-01-01T00:00:00Z   # a new world's first moment, instead of now
